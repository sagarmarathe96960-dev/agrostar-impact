<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <title>एपीआय डेमो वेबसाइट</title>
</head>

<body>
    <h1>एपीआय मधून पोस्ट (मराठीत)</h1>
    <ul id="postList"></ul>

    <script>
        // Function to translate text into Marathi using Google Translate API
        async function translateText(text) {
            const apiKey = "YOUR_GOOGLE_API_KEY"; // Replace with your Google API key
            const url = `https://translation.googleapis.com/language/translate/v2?key=${apiKey}`;

            const response = await fetch(url, {
                method: "POST",
                body: JSON.stringify({
                    q: text,
                    target: "mr"   // 'mr' is the language code for Marathi
                }),
                headers: {
                    "Content-Type": "application/json"
                }
            });

            const data = await response.json();
            return data.data.translations[0].translatedText;
        }

        // Function to load posts and translate titles
        async function loadPosts() {
            const response = await fetch("https://jsonplaceholder.typicode.com/posts");
            const posts = await response.json();
            const list = document.getElementById("postList");

            for (let post of posts.slice(0, 5)) {
                const translatedTitle = await translateText(post.title);
                const item = document.createElement("li");
                // Labels in Marathi + translated title
                item.textContent = `ओळख क्रमांक: ${post.id} | शीर्षक: ${translatedTitle}`;
                list.appendChild(item);
            }
        }

        loadPosts();
    </script>
</body>

</html>
